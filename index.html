<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Rush</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <div class="navbar">
      <div class="logo">
        <img src="./Assets/Neon Keyrush Gaming Logo.png" alt="Logo" />
      </div>
      <div class="objects">
        <span>Home</span>
        <span>Level</span>
        <span>Stats</span>
        <span>About</span>
      </div>
      <button id="playbtn" type="submit">Play Now</button>
    </div>

    <!-- Hero Section / Middle Part  -->

    <div class="main">
      <div class="box">
        <span>TYPE</span>
        <span>IMPROVE</span>
        <span>LEVEL UP</span>
      </div>
      <div class="info">
        <h1>KEYRUSH</h1>
        <h5>MASTER EVERY KEYSTORKE</h5>
        <p>A typing game to improve your speed, accuracy and focus.</p>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
